<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Notícias publicadas entre 13 e 19 de novembro de 2026</title>
  <desc id="desc">Dez notícias com data de publicação válida, todas em 13 de novembro: cinco do Senado Federal, três do NIC.br, uma do EDPB e uma da Mercocidades. Não há execução registrada de 14 a 19 de novembro.</desc>
  <rect width="1200" height="720" fill="#f7f8fa"/>
  <text x="70" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#152238">Coleta semanal — notícias por fonte</text>
  <text x="70" y="100" font-family="Arial,sans-serif" font-size="18" fill="#4d5b70">Janela: 13–19 nov. 2026 · 10 publicações válidas · última execução: 13 nov. 2026</text>
  <line x1="260" y1="150" x2="260" y2="520" stroke="#b5bdc9" stroke-width="1"/>
  <line x1="260" y1="520" x2="1090" y2="520" stroke="#b5bdc9" stroke-width="1"/>
  <g font-family="Arial,sans-serif" font-size="18" fill="#26364d">
    <text x="70" y="205">Senado Federal</text><text x="70" y="285">NIC.br</text><text x="70" y="365">EDPB</text><text x="70" y="445">Mercocidades</text>
  </g>
  <g fill="#3468d4"><rect x="260" y="175" width="750" height="42" rx="5"/><rect x="260" y="255" width="450" height="42" rx="5"/><rect x="260" y="335" width="150" height="42" rx="5"/><rect x="260" y="415" width="150" height="42" rx="5"/></g>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152238"><text x="1025" y="204">5</text><text x="725" y="284">3</text><text x="425" y="364">1</text><text x="425" y="444">1</text></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#6b7688"><text x="255" y="545">0</text><text x="405" y="545">1</text><text x="555" y="545">2</text><text x="705" y="545">3</text><text x="855" y="545">4</text><text x="1005" y="545">5 notícias</text></g>
  <rect x="70" y="585" width="1060" height="80" rx="8" fill="#fff1d6" stroke="#e6b44a"/>
  <text x="95" y="618" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#734d00">Cobertura incompleta</text>
  <text x="95" y="648" font-family="Arial,sans-serif" font-size="16" fill="#734d00">A base não registra execução nem novas datas de publicação de 14 a 19/11; ausência de dados não equivale a zero notícias.</text>
</svg>
