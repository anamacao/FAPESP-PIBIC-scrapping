<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cobertura da coleta semanal de 16 a 22 de outubro de 2026</title>
  <desc id="desc">A base não foi atualizada depois de 16 de outubro e não contém publicações com data válida na janela. Os sete dias são apresentados como não coletados, e não como zero notícias.</desc>
  <rect width="1200" height="650" fill="#f7f8fa"/>
  <text x="60" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17233c">Coleta semanal de notícias</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#536079">Janela: 16–22 out. 2026 · critério: published_date válida</text>
  <rect x="60" y="135" width="1080" height="370" rx="20" fill="#ffffff" stroke="#d8dee9"/>
  <text x="600" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#8a5a00">Sem cobertura da janela</text>
  <text x="600" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#536079">A última execução disponível foi gerada em 16 out. 2026, 13:43:07 UTC.</text>
  <text x="600" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#536079">A data de publicação mais recente no CSV é 15 out. 2026.</text>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
    <rect x="135" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="195" y="408" fill="#68758a">16 out.</text>
    <rect x="270" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="330" y="408" fill="#68758a">17 out.</text>
    <rect x="405" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="465" y="408" fill="#68758a">18 out.</text>
    <rect x="540" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="600" y="408" fill="#68758a">19 out.</text>
    <rect x="675" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="735" y="408" fill="#68758a">20 out.</text>
    <rect x="810" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="870" y="408" fill="#68758a">21 out.</text>
    <rect x="945" y="375" width="120" height="55" rx="8" fill="#eef1f5"/><text x="1005" y="408" fill="#68758a">22 out.</text>
  </g>
  <rect x="60" y="540" width="1080" height="70" rx="14" fill="#fff2d8" stroke="#e4bc63"/>
  <text x="85" y="570" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#78520d">Não interpretar como zero notícias</text>
  <text x="85" y="595" font-family="Arial,sans-serif" font-size="15" fill="#78520d">657 registros totais; 0 registros publicados na janela; 22 first_seen em 16 out., todos referentes a publicações anteriores.</text>
</svg>
