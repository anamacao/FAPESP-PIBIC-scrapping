name: FAPESP weekly news and notebook diagnostics

on:
  workflow_dispatch:
  schedule:
    # Sexta-feira, 07:00 no horário de Brasília.
    - cron: "0 10 * * 5"
  push:
    paths:
      - ".github/workflows/fapesp-weekly.yml"
      - "scripts/fapesp_weekly.py"
      - "tests/test_fapesp_weekly.py"

permissions:
  contents: write

concurrency:
  group: fapesp-weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'ipython>=8,<10'
      - name: Test parsers and data preservation
        run: python -m unittest discover -s tests -v
      - name: Collect and diagnose
        id: collect
        shell: bash
        run: |
          set +e
          python scripts/fapesp_weekly.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save cumulative data and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.csv data/runs/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza notícias e diagnóstico semanal FAPESP"
            git push
          fi
      - name: Fail when a source or notebook check failed
        shell: bash
        run: |
          python scripts/fapesp_weekly.py --check-report data/runs/latest.json
          test "${{ steps.collect.outputs.exit_code }}" = "0"
