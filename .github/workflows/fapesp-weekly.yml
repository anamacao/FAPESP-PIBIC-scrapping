name: FAPESP weekly news and notebook diagnostics

on:
  workflow_dispatch:
  schedule:
    # Duas janelas na sexta: 07:17 e 08:47 no horário de Brasília.
    # A segunda reduz a chance de perder a semana quando o GitHub descarta um disparo.
    - cron: "17 10 * * 5"
    - cron: "47 11 * * 5"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/fapesp-weekly.yml"
      - "scripts/fapesp_weekly.py"
      - "scripts/fapesp_agent.py"
      - "scripts/source_collectors.py"
      - "scripts/build_updateable_dashboard.py"
      - "scripts/painel_atualizavel.html"
      - "scripts/painel_atualizavel.js"
      - "tests/test_source_collectors.py"
      - "scripts/generate_weekly_dashboard.py"
      - "Analise/**"
      - "tests/test_fapesp_weekly.py"
      - "tests/test_fapesp_agent.py"
      - "scripts/curadoria_agent.py"
      - "scripts/curadoria_dashboard.py"
      - "scripts/curadoria_dashboard.html"
      - "Curadoria/Agente_curadoria_FAPESP.ipynb"
      - "tests/test_curadoria_agent.py"
      - "tests/test_curadoria_dashboard.py"
      - "config/curadoria.json"
      - "requirements-analytics.txt"
      - "data/curadoria/Catalogo_de_fontes_FAPESP.md"

permissions:
  contents: write

concurrency:
  group: fapesp-weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'ipython>=8,<10' 'pandas>=2.2,<3' 'plotly>=5.24,<7' -r requirements-analytics.txt
      - name: Test parsers and data preservation
        run: python -m unittest discover -s tests -v
      - name: Collect and diagnose
        id: collect
        shell: bash
        run: |
          set +e
          python scripts/fapesp_weekly.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build weekly dashboard
        id: analysis
        shell: bash
        run: |
          set +e
          python scripts/generate_weekly_dashboard.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate curation tables and charts
        run: python scripts/curadoria_agent.py
      - name: Collect all registered public sources
        run: python scripts/source_collectors.py --pages 10
      - name: Build one updateable offline HTML
        run: python scripts/build_updateable_dashboard.py
      - name: Upload reusable curation report
        uses: actions/upload-artifact@v4
        with:
          name: curadoria-fapesp
          path: reports/curadoria/latest/
          retention-days: 30
      - name: Save cumulative data and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/news.csv data/runs/*.json reports/curadoria/latest/
          if compgen -G 'data/analysis/*' > /dev/null; then
            git add -f data/analysis/*
          fi
          git add -f data/unified/public_records.csv data/unified/diagnostico.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza notícias e diagnóstico semanal FAPESP"
            git push
          fi
      - name: Fail when a source or notebook check failed
        shell: bash
        run: |
          python scripts/fapesp_weekly.py --check-report data/runs/latest.json
          test "${{ steps.collect.outputs.exit_code }}" = "0"
          test "${{ steps.analysis.outputs.exit_code }}" = "0"
